name: Vision CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.lock
      - run: ruff check src tests scripts
      - run: pytest -m 'not real' --cov=bean_vision
      - name: Scan tracked files for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
  container:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: docker build -t bean-vision:ci .
      - run: docker run -d --name bean-vision-ci -p 127.0.0.1:8000:8000 bean-vision:ci
      - run: python scripts/smoke.py
      - name: Verify non-root and healthy
        run: |
          test "$(docker exec bean-vision-ci id -u)" = "10001"
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' bean-vision-ci)" = healthy ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Stop test container
        if: always()
        run: docker stop bean-vision-ci || true
  publish:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
