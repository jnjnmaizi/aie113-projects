[project]
name = "bean-vision"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1", "transformers==4.57.6",
  "numpy==2.5.5", "pillow==13.0.0", "fastapi==0.165.0",
  "uvicorn==0.54.0", "python-multipart==0.0.34", "pydantic-settings==2.16.3"
]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.17.6", "datasets==5.0.1", "matplotlib==3.11.2", "pandas==3.1.1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["real: requires downloaded real model and test data"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
